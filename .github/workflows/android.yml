name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: '4.3.7'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Libraries
        run: |
          sh ./setup/mobile.sh
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
          haxelib run lime rebuild hxcpp --quiet

      - name: Test platform guards and V1 regressions
        run: |
          python3 tests/discord_platforms.py
          python3 tests/optimization_v1.py

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Verify Android has no Discord dependency
        run: |
          haxelib run lime display android -release > "$RUNNER_TEMP/android-release.hxml"
          if grep -E 'hxdiscord_rpc|DISCORD_ALLOWED' "$RUNNER_TEMP/android-release.hxml"; then
            echo "Android must not enable Discord RPC"
            exit 1
          fi

      - name: Compile Android release
        run: haxelib run lime build android -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PsychEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
